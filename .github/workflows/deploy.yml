name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Build-time placeholders only — real secrets stay on the VPS.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXTAUTH_URL: https://www.nabarawy.tech
      NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
      NEXT_PUBLIC_APP_URL: https://www.nabarawy.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm ci --include=dev

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 35m
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH=main
            /usr/local/bin/deploy-nabra.sh
